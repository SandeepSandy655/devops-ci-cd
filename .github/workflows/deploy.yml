name: CI/CD Bicep Deployment

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            az group create --name <your-srn>-<your-firstname>-rg --location centralindia

      - name: Deploy Infrastructure via Bicep
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --resource-group <your-srn>-<your-firstname>-rg \
              --parameters parameters.bicepparam